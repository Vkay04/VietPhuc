<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="giaoLinhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3949AB"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
    <linearGradient id="collarTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EAF6"/>
    </linearGradient>
  </defs>

  <!-- ÁO GIAO LĨNH CỔ TRÉO (THỜI LÝ - TRẦN - LÊ) - KHỚP 100% TỈ LỆ THÂN MODEL -->
  <g id="outer-giaolinh">
    <!-- Sleeves (Tay thụng truyền thống bao bọc kín vai nách và dừng tại cổ tay Y: 905) -->
    <!-- Left Sleeve -->
    <path d="M 375 470 Q 280 580 235 820 Q 240 905 275 905 L 330 905 L 355 820 Q 380 660 410 520 Z" fill="url(#giaoLinhGrad)" stroke="#1A237E" stroke-width="2"/>
    <!-- Right Sleeve -->
    <path d="M 625 470 Q 720 580 765 820 Q 760 905 725 905 L 670 905 L 645 820 Q 620 660 590 520 Z" fill="url(#giaoLinhGrad)" stroke="#1A237E" stroke-width="2"/>

    <!-- Main Body & Robe Flaps (Bao bọc bờ vai X: 375-625, eo Y: 700-720, hông Y: 850 đến gấu Y: 1355) -->
    <path d="M 466 450 L 375 470 Q 350 700 345 1050 Q 335 1280 345 1355 Q 500 1380 655 1355 Q 665 1280 655 1050 Q 650 700 625 470 L 534 450 Z" fill="url(#giaoLinhGrad)" stroke="#1A237E" stroke-width="2.5"/>

    <!-- Cross Collar (Cổ tréo vắt sang phải) -->
    <!-- Left Collar band going diagonal down to right waist -->
    <path d="M 450 435 L 478 435 L 585 710 L 555 710 Z" fill="url(#collarTrim)" stroke="#1A237E" stroke-width="1.5"/>
    <!-- Right Collar band underneath -->
    <path d="M 550 435 L 522 435 L 435 660 L 465 660 Z" fill="url(#collarTrim)" stroke="#1A237E" stroke-width="1.5"/>

    <!-- Waist Sash / Đai Lưng Lụa Y: 720 - 760 -->
    <path d="M 390 720 Q 500 740 610 720 L 610 760 Q 500 780 390 760 Z" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
    <!-- Knot and Pendant ribbon -->
    <ellipse cx="500" cy="750" rx="14" ry="12" fill="#D32F2F"/>
    <path d="M 490 760 L 485 910 L 505 910 L 500 760 Z" fill="#D32F2F"/>
    <circle cx="495" cy="840" r="10" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
  </g>
</svg>
