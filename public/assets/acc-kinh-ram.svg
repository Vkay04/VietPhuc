<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="sunglassGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="70%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <!-- KÍNH RÂM THỜI TRANG GEN Z (ĐEN COOL NGẦU) -->
  <g id="acc-kinh-ram">
    <!-- Left Lens Frame -->
    <rect x="420" y="272" width="55" height="34" rx="8" fill="url(#sunglassGlass)" stroke="#000000" stroke-width="3"/>
    <!-- Left Glare highlight -->
    <line x1="430" y1="278" x2="445" y2="298" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Bridge connecting lenses -->
    <path d="M 475 285 Q 500 280 525 285" stroke="#D4AF37" stroke-width="3.5" fill="none"/>

    <!-- Right Lens Frame -->
    <rect x="525" y="272" width="55" height="34" rx="8" fill="url(#sunglassGlass)" stroke="#000000" stroke-width="3"/>
    <!-- Right Glare highlight -->
    <line x1="535" y1="278" x2="550" y2="298" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Temples reaching to ears -->
    <line x1="420" y1="282" x2="385" y2="280" stroke="#000000" stroke-width="3"/>
    <line x1="580" y1="282" x2="615" y2="280" stroke="#000000" stroke-width="3"/>

    <text x="500" y="260" font-family="'Comfortaa', sans-serif" font-size="12" fill="#212121" text-anchor="middle" font-weight="bold">Kính Râm Gen Z</text>
  </g>
</svg>
