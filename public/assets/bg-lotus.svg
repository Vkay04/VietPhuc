<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="lotusSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2F1"/>
      <stop offset="40%" stop-color="#E8F5E9"/>
      <stop offset="70%" stop-color="#F1F8E9"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FCE4EC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BACKGROUND: ĐẦM SEN LÀNG QUÊ THANH BÌNH -->
  <rect width="1000" height="1500" fill="url(#lotusSky)"/>
  <circle cx="500" cy="400" r="300" fill="url(#pinkGlow)"/>

  <!-- Distant Village Bamboo Silhouette -->
  <path d="M 0 1050 Q 200 980 400 1020 Q 600 970 800 1010 Q 900 980 1000 1000 L 1000 1500 L 0 1500 Z" fill="#C8E6C9" opacity="0.35"/>

  <!-- Water Surface -->
  <rect x="0" y="1200" width="1000" height="300" fill="#B2DFDB" opacity="0.4"/>
  <line x1="0" y1="1200" x2="1000" y2="1200" stroke="#80CBC4" stroke-width="2"/>

  <!-- Giant Lotus Leaves (Lá Sen Xanh Mát) at corners -->
  <!-- Left Lotus Leaf -->
  <ellipse cx="120" cy="1320" rx="180" ry="90" fill="#81C784" stroke="#4CAF50" stroke-width="2" opacity="0.75"/>
  <path d="M 120 1320 L 20 1280 M 120 1320 L 60 1380 M 120 1320 L 200 1300 M 120 1320 L 160 1390" stroke="#388E3C" stroke-width="1.5"/>

  <!-- Right Lotus Leaf -->
  <ellipse cx="880" cy="1340" rx="190" ry="95" fill="#81C784" stroke="#4CAF50" stroke-width="2" opacity="0.75"/>
  <path d="M 880 1340 L 980 1300 M 880 1340 L 940 1400 M 880 1340 L 800 1320 M 880 1340 L 840 1410" stroke="#388E3C" stroke-width="1.5"/>

  <!-- Blooming Pink Lotus Blossoms -->
  <!-- Left Lotus Flower -->
  <g transform="translate(180, 1220) scale(0.85)">
    <path d="M 0 -40 C -25 -20 -30 10 0 35 C 30 10 25 -20 0 -40 Z" fill="#F48FB1"/>
    <path d="M -20 -10 C -40 10 -35 25 0 35 C -5 20 -10 10 -20 -10 Z" fill="#F06292"/>
    <path d="M 20 -10 C 40 10 35 25 0 35 C 5 20 10 10 20 -10 Z" fill="#F06292"/>
    <circle cx="0" cy="10" r="6" fill="#FFEE58"/>
  </g>

  <!-- Right Lotus Flower -->
  <g transform="translate(820, 1240) scale(0.9)">
    <path d="M 0 -40 C -25 -20 -30 10 0 35 C 30 10 25 -20 0 -40 Z" fill="#F48FB1"/>
    <path d="M -20 -10 C -40 10 -35 25 0 35 C -5 20 -10 10 -20 -10 Z" fill="#F06292"/>
    <path d="M 20 -10 C 40 10 35 25 0 35 C 5 20 10 10 20 -10 Z" fill="#F06292"/>
    <circle cx="0" cy="10" r="6" fill="#FFEE58"/>
  </g>

  <!-- Gentle Dragonfly floating -->
  <g transform="translate(300, 500) rotate(15) scale(0.6)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="4" ry="24" fill="#E91E63"/>
    <ellipse cx="-20" cy="-5" rx="22" ry="6" fill="#80DEEA" opacity="0.8"/>
    <ellipse cx="20" cy="-5" rx="22" ry="6" fill="#80DEEA" opacity="0.8"/>
  </g>
</svg>
