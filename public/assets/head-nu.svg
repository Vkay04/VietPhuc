<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <radialGradient id="skinGradHeadNu" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFF8F2"/>
      <stop offset="60%" stop-color="#FDECE0"/>
      <stop offset="100%" stop-color="#F7D8C4"/>
    </radialGradient>
    <radialGradient id="blushHeadNu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9EAA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF9EAA" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlowHead" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4A3B32" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- LAYER 6: ĐẦU NHÂN VẬT NỮ (HEAD-BASE - LAYER ĐỘC LẬP TRÊN ÁO NGOÀI) -->
  <g id="head-nu" filter="url(#softGlowHead)">
    <!-- Head & Face (Anime delicate oval: chin at Y: 420) -->
    <path d="M 390 280 Q 390 165 500 165 Q 610 165 610 280 Q 610 390 500 420 Q 390 390 390 280 Z" fill="url(#skinGradHeadNu)" stroke="#DEBEA6" stroke-width="2.5"/>

    <!-- Ears -->
    <path d="M 390 280 Q 380 300 388 320 Q 394 310 392 290 Z" fill="url(#skinGradHeadNu)" stroke="#DEBEA6" stroke-width="2"/>
    <path d="M 610 280 Q 620 300 612 320 Q 606 310 608 290 Z" fill="url(#skinGradHeadNu)" stroke="#DEBEA6" stroke-width="2"/>

    <!-- Anime Face Features -->
    <!-- Blush -->
    <circle cx="435" cy="325" r="24" fill="url(#blushHeadNu)"/>
    <circle cx="565" cy="325" r="24" fill="url(#blushHeadNu)"/>

    <!-- Eyebrows -->
    <path d="M 425 255 Q 450 246 470 256" stroke="#5C4033" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 530 256 Q 550 246 575 255" stroke="#5C4033" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Left Eye -->
    <g id="head-left-eye">
      <ellipse cx="445" cy="290" rx="19" ry="23" fill="#3D2B1F"/>
      <ellipse cx="445" cy="295" rx="16" ry="16" fill="#6B4423"/>
      <circle cx="439" cy="283" r="6.5" fill="#FFFFFF"/>
      <circle cx="452" cy="298" r="3.5" fill="#FFFFFF"/>
      <path d="M 422 280 Q 445 262 468 278" stroke="#2B1A0E" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 465 272 L 472 266" stroke="#2B1A0E" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Right Eye -->
    <g id="head-right-eye">
      <ellipse cx="555" cy="290" rx="19" ry="23" fill="#3D2B1F"/>
      <ellipse cx="555" cy="295" rx="16" ry="16" fill="#6B4423"/>
      <circle cx="549" cy="283" r="6.5" fill="#FFFFFF"/>
      <circle cx="562" cy="298" r="3.5" fill="#FFFFFF"/>
      <path d="M 532 278 Q 555 262 578 280" stroke="#2B1A0E" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 535 272 L 528 266" stroke="#2B1A0E" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Cute Nose & Smile -->
    <circle cx="500" cy="320" r="2" fill="#D3A287"/>
    <path d="M 488 348 Q 500 360 512 348" stroke="#D06A6A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
