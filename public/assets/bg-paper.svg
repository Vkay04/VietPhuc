<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="doPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#FAF4EB"/>
      <stop offset="100%" stop-color="#F5ECE0"/>
    </linearGradient>
    <!-- Paper Grid / Dots -->
    <pattern id="paperGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#D7C9B8" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- BACKGROUND: GIẤY DÓ VINTAGE • BÚP BÊ GIẤY PAPER DOLL -->
  <rect width="1000" height="1500" fill="url(#doPaper)"/>
  <rect width="1000" height="1500" fill="url(#paperGrid)"/>

  <!-- Vintage Decorative Border / Khung viền chỉ son gốm -->
  <rect x="40" y="40" width="920" height="1420" rx="20" fill="none" stroke="#D3B89D" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="52" y="52" width="896" height="1396" rx="16" fill="none" stroke="#E6D3C0" stroke-width="1"/>

  <!-- Corner Ornamental knots -->
  <g stroke="#C2A280" stroke-width="2" fill="none">
    <!-- Top Left -->
    <path d="M 40 80 L 80 80 L 80 40"/>
    <circle cx="80" cy="80" r="4" fill="#C2A280"/>
    <!-- Top Right -->
    <path d="M 960 80 L 920 80 L 920 40"/>
    <circle cx="920" cy="80" r="4" fill="#C2A280"/>
    <!-- Bottom Left -->
    <path d="M 40 1420 L 80 1420 L 80 1460"/>
    <circle cx="80" cy="1420" r="4" fill="#C2A280"/>
    <!-- Bottom Right -->
    <path d="M 960 1420 L 920 1420 L 920 1460"/>
    <circle cx="920" cy="1420" r="4" fill="#C2A280"/>
  </g>

  <!-- Watermark Seal at top -->
  <g transform="translate(500, 100)" text-anchor="middle" font-family="'Playfair Display', serif">
    <text y="0" font-size="20" fill="#B38B6D" letter-spacing="4" font-weight="bold">VIỆT PHỤC REMIX</text>
    <line x1="-120" y1="12" x2="120" y2="12" stroke="#D3B89D" stroke-width="1"/>
  </g>

  <!-- Bottom Paper Doll Cutting Mark Guideline aesthetic -->
  <g transform="translate(500, 1435)" text-anchor="middle" font-family="'Comfortaa', sans-serif" font-size="11" fill="#A89481">
    <text>✂ Búp bê giấy truyền thống Việt Nam • Thiết kế tỉ lệ chuẩn 1000 x 1500 px</text>
  </g>
</svg>
