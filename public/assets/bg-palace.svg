<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="palaceSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="45%" stop-color="#FFE0B2"/>
      <stop offset="85%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#E8EAF6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFD54F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cloudBrocade" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 20 50 Q 35 30 50 50 Q 65 30 80 50 Q 60 70 40 70 Z" fill="none" stroke="#E65100" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- BACKGROUND: CUNG ĐÌNH HUẾ CỔ KÍNH • LẦU SON GÁC TÍA -->
  <rect width="1000" height="1500" fill="url(#palaceSky)"/>
  <rect width="1000" height="1500" fill="url(#cloudBrocade)"/>

  <!-- Golden Imperial Sun -->
  <circle cx="500" cy="400" r="280" fill="url(#sunGlow)"/>

  <!-- Ancient Imperial Palace Silhouette in Hue -->
  <!-- Distant Mountains -->
  <path d="M 0 950 Q 250 820 500 880 Q 750 820 1000 950 L 1000 1500 L 0 1500 Z" fill="#D7CCC8" opacity="0.35"/>

  <!-- Imperial Citadel Curved Roof & Pavilions (Lầu Ngũ Phụng / Ngọ Môn) -->
  <g opacity="0.45" fill="#BF360C">
    <!-- Center Roof Upper Tier -->
    <path d="M 400 780 Q 500 750 600 780 L 590 810 L 410 810 Z"/>
    <!-- Center Roof Lower Tier (Curved eaves with dragon fins) -->
    <path d="M 330 840 Q 500 810 670 840 L 660 880 Q 500 860 340 880 Z"/>
    <!-- Columns -->
    <rect x="360" y="880" width="12" height="180"/>
    <rect x="440" y="880" width="12" height="180"/>
    <rect x="550" y="880" width="12" height="180"/>
    <rect x="630" y="880" width="12" height="180"/>
  </g>

  <!-- Ancient Brick Platform / Balustrade at the bottom -->
  <rect x="0" y="1300" width="1000" height="200" fill="#EFEBE9"/>
  <line x1="0" y1="1300" x2="1000" y2="1300" stroke="#BCAAA4" stroke-width="4"/>
  <line x1="0" y1="1360" x2="1000" y2="1360" stroke="#D7CCC8" stroke-width="2"/>
  <line x1="0" y1="1420" x2="1000" y2="1420" stroke="#D7CCC8" stroke-width="2"/>

  <!-- Decorative Imperial Cloud Scrolls -->
  <path d="M 120 250 Q 180 200 240 250 Q 210 290 150 280 Z" fill="#FFE0B2" opacity="0.5"/>
  <path d="M 760 280 Q 820 230 880 280 Q 850 320 790 310 Z" fill="#FFE0B2" opacity="0.5"/>
</svg>
